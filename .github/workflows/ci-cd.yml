name: NS Choco Delight CI/CD Safety Pipeline

on:
  push:
    branches: [ main, migrate-to-nextjs ]
  pull_request:
    branches: [ main ]

jobs:
  verify-build:
    name: Run Next.js Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 environment
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Next.js production build
        run: npm run build
        env:
          MONGODB_URI: mongodb+srv://ns-choco-admin:ylCMqqv51E1A6k3S@ns-choco.7cvzn8w.mongodb.net/nschocodelight?retryWrites=true&w=majority&appName=ns-choco
