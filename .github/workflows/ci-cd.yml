name: NS Choco Delight CI/CD Safety Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Run Automated Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v3

      - name: Setup Node.js 18 environment
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: 'npm'

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Execute backend Jest test suite
        run: |
          cd backend
          npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_key_12345

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Verify frontend production Vite build
        run: |
          cd frontend
          npm run build
